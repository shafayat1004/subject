# Path policy for the EggShell subject repo.
# Enforces CLAUDE.md rule 8 (framework-only scope) and the retired
# render DSL ban (rule 7, now legacy). Precedence: never > ask_first >
# may_edit > else (warn "outside declared scope").
#
# Framework-only: the agent edits Lib*, Meta, ThirdParty, Fake, scripts,
# docs, and the gallery (AppEggShellGallery, rule 10 exception). Suite*
# dirs are applications and need explicit approval. A new App* dir that
# is not the gallery falls through to "outside declared scope" (warn).
may_edit:
  - "Lib*"
  - "Meta"
  - "ThirdParty"
  - "Fake"
  - "scripts"
  - "docs"
  - "AppEggShellGallery"
  - "evidence"
  - "policies"
  - "skills"
  - ".agent-os"
  - ".claude"
  - ".cursor"
  - ".config"
  - ".vscode"
  - ".github"
  - ".githooks"
  - ".opencode"
  - ".superpowers"
  - "*.md"
  - "*.fsx"
  - "*.json"
  - "*.sh"
  - "*.cmd"
  - "STATE.yaml"
  - "VERSION"
  - ".editorconfig"
  - ".eggshellfmtignore"
  - ".fantomasrc.json"
  - ".gitignore"
  - ".gitattributes"
  - "LICENSE"
  - "nuget.config"
  - "global.json"
  - "Directory.Build.*"
ask_first:
  - "Suite*"
never:
  - "_autogenerated_"
  - "*.render"
  - "*.typext.fs"
  - "*.fs.js"
  - "node_modules"
  - ".build"
  - ".git"
