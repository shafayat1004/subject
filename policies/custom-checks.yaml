# Custom checks for the EggShell subject repo.
# These run as part of `agentos all` after the six built-in checks.
# A check with on_fail: error blocks `agentos done`.
# A check with on_fail: warn reports but does not block.
#
# These checks enforce AGENTS.md rules that have a script-based gate
# but are not covered by the built-in path, command, or dependency
# checks.

checks:
  # AGENTS.md rule: no em-dash (U+2014) in prose. Scans tracked .md
  # repo-wide via scripts/em-dash-scan.sh. Delegated to a script so the
  # em-dash byte literal is not mangled by the yaml_min double-quote
  # escaper (which over-escapes \xHH, producing a false green).
  - name: em-dash-scan
    command: "scripts/em-dash-scan.sh"
    expect: pass
    grade: A
    on_fail: warn

  # AGENTS.md rule: F# formatting via eggshell-fmt --check on tracked
  # .fs files. Fails open (exit 0) ONLY when dotnet or eggshell-fmt is
  # not installed; when present, the --check exit code propagates so a
  # real formatting failure is reported (was swallowed by || exit 0 and
  # a yaml_min escape bug that made git ls-files match nothing).
  # File enumeration + _autogenerated_/.build exclusion live in
  # scripts/run-scanner.sh so the "*.fs" glob stays in plain bash (the
  # yaml_min double-quote escaper over-escapes \" to \", which breaks
  # the glob when it is inlined here). Advisory (warn).
  - name: eggshell-fmt-check
    command: "sh -c 'if command -v dotnet >/dev/null 2>&1 && dotnet tool list --local 2>/dev/null | grep -q eggshell-fmt; then scripts/run-scanner.sh dotnet tool run eggshell-fmt -- --check; else exit 0; fi'"
    expect: pass
    grade: B+
    on_fail: warn

  # AGENTS.md rule 12: accessible design is mandatory. Runs the a11y
  # scan script on tracked .fs files via scripts/run-scanner.sh (same
  # yaml_min glob workaround as fmt-check). Fails open when node or
  # the script is missing. Advisory (warn) until the scan is comprehensive.
  - name: a11y-scan
    command: "sh -c 'if command -v node >/dev/null 2>&1 && [ -f .claude/skills/a11y-check/scripts/scan-a11y.mjs ]; then scripts/run-scanner.sh node .claude/skills/a11y-check/scripts/scan-a11y.mjs; else exit 0; fi'"
    expect: pass
    grade: B+
    on_fail: warn

  # AGENTS.md component conventions: no style leaks. Runs the style-
  # leak scan script on tracked .fs files via scripts/run-scanner.sh.
  # Fails open when node or the script is missing. Advisory (warn).
  - name: style-leak-scan
    command: "sh -c 'if command -v node >/dev/null 2>&1 && [ -f .claude/skills/style-leak-audit/scripts/scan-style-leaks.mjs ]; then scripts/run-scanner.sh node .claude/skills/style-leak-audit/scripts/scan-style-leaks.mjs; else exit 0; fi'"
    expect: pass
    grade: B+
    on_fail: warn

  # Gallery docs: all relative .md links must resolve and every page
  # must be in llms.txt. Fails open ONLY when node or the script is
  # missing; when present, the check exit code propagates (was swallowed
  # by || exit 0). Advisory (warn).
  - name: doc-links
    command: "sh -c 'if command -v node >/dev/null 2>&1 && [ -f .claude/skills/docs-sync/scripts/check-doc-links.mjs ]; then node .claude/skills/docs-sync/scripts/check-doc-links.mjs; else exit 0; fi'"
    expect: pass
    grade: A
    on_fail: warn
