# Custom checks for the EggShell subject repo.
# These run as part of `agentos all` after the six built-in checks.
# A check with on_fail: error blocks `agentos done`.
# A check with on_fail: warn reports but does not block.
#
# These checks enforce CLAUDE.md rules that have a script-based gate
# but are not covered by the built-in path, command, or dependency
# checks. They mirror the existing scripts/ ci-gate.sh gates.

checks:
  # CLAUDE.md rule 9: no em-dash in prose. Scans .md files repo-wide
  # including the gallery docs site (AppEggShellGallery/public-dev/docs/)
  # for the Unicode em-dash character (U+2014). Fails open when grep
  # is unavailable.
  - name: em-dash-scan
    command: "sh -c 'grep -rl \"$(printf \"\\xe2\\x80\\x94\")\" *.md docs/ AppEggShellGallery/public-dev/docs/ 2>/dev/null && exit 1 || exit 0'"
    expect: pass
    grade: A
    on_fail: warn

  # CLAUDE.md rule: F# formatting. Runs eggshell-fmt --check on
  # tracked .fs files. Fails open (exit 0) when the tool is not
  # installed, same as ci-gate.sh does. This is advisory (warn) so
  # a missing tool does not block done; tighten to error when the
  # tool is confirmed on all dev machines.
  - name: eggshell-fmt-check
    command: "sh -c 'command -v dotnet >/dev/null 2>&1 && dotnet tool list --local 2>/dev/null | grep -q eggshell-fmt && { git ls-files \"*.fs\" | xargs dotnet tool run eggshell-fmt -- --check; } || exit 0'"
    expect: pass
    grade: B+
    on_fail: warn

  # CLAUDE.md rule 12: accessible design is mandatory. Runs the a11y
  # scan script on tracked .fs files. Fails open when node or the
  # script is missing. Advisory (warn) until the scan is comprehensive.
  - name: a11y-scan
    command: "sh -c 'command -v node >/dev/null 2>&1 && [ -f .claude/skills/a11y-check/scripts/scan-a11y.mjs ] && { git ls-files \"*.fs\" | xargs node .claude/skills/a11y-check/scripts/scan-a11y.mjs; } || exit 0'"
    expect: pass
    grade: B+
    on_fail: warn

  # CLAUDE.md component conventions: no style leaks. Runs the style-
  # leak scan script on tracked .fs files. Fails open when node or
  # the script is missing. Advisory (warn).
  - name: style-leak-scan
    command: "sh -c 'command -v node >/dev/null 2>&1 && [ -f .claude/skills/style-leak-audit/scripts/scan-style-leaks.mjs ] && { git ls-files \"*.fs\" | xargs node .claude/skills/style-leak-audit/scripts/scan-style-leaks.mjs; } || exit 0'"
    expect: pass
    grade: B+
    on_fail: warn

  # Gallery docs: all relative .md links must resolve and every page
  # must be in llms.txt. Run by the docs-sync skill today; wired here
  # as a custom check so the gate runs on every `agentos all`. Fails
  # open when node or the script is missing.
  - name: doc-links
    command: "sh -c 'command -v node >/dev/null 2>&1 && [ -f .claude/skills/docs-sync/scripts/check-doc-links.mjs ] && node .claude/skills/docs-sync/scripts/check-doc-links.mjs || exit 0'"
    expect: pass
    grade: A
    on_fail: warn
