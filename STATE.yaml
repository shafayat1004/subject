assumptions: []
decisions:
  - decision: use vendored model (not shared) for portability
    rationale: a fresh clone works without an external agent-os checkout
  - decision: AppEggShellGallery in may_edit (not ask_first) despite App* prefix
    rationale: CLAUDE.md rule 10 says the gallery must be updated when components convert; it is the explicit exception to the framework-only rule
  - decision: compile verifier clears the Fable cache before building
    rationale: forces a fresh compile so the content assert for "Started Fable compilation" always has a chance to pass; prevents the stale-cache false green
  - decision: format check via custom-checks.yaml, not verification.yaml
    rationale: the format command needs staged or tracked files, not a blank run; the custom check fails open when the tool is missing
  - decision: keep existing scripts/ as manual tools, not wired as hooks
    rationale: the agentos policies replace the hook wiring; the scripts remain useful for manual one-shot checks and ci-gate.sh
